<!DOCTYPE html>
<html>
<head>
  <title>Test</title>
  <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
  <h1>Test Dashboard</h1>
  <div id="chart" style="width:600px;height:400px;"></div>
  <script>
    console.log('Script starting...');
    fetch('data/dashboard_data.json')
      .then(r => r.json())
      .then(data => {
        console.log('Data loaded:', data.metadata.total_reviews);
        const dates = data.daily_stats.map(d => d.date);
        const positive = data.daily_stats.map(d => d.sentiment_distribution.positive);
        
        Plotly.newPlot('chart', [{
          x: dates,
          y: positive,
          type: 'scatter',
          mode: 'lines'
        }]);
        
        document.body.innerHTML += '<p>SUCCESS! Charts rendered.</p>';
      })
      .catch(e => {
        console.error('Error:', e);
        document.body.innerHTML += '<p>Error: ' + e.message + '</p>';
      });
  </script>
</body>
</html>
