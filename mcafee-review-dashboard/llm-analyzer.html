<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McAfee Review Analyzer - One at a Time</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 30px;
        }
        h1 {
            color: #C01818;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .review-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #C01818;
        }
        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .author {
            font-weight: 600;
            color: #333;
        }
        .rating {
            color: #f59e0b;
            font-size: 18px;
        }
        .review-content {
            color: #444;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .mcafee-response {
            background: #fff3cd;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .mcafee-response strong {
            color: #856404;
        }
        .llm-analysis {
            background: #e7f3ff;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .llm-analysis h3 {
            color: #004085;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .analysis-row {
            display: flex;
            margin-bottom: 8px;
        }
        .analysis-label {
            width: 120px;
            font-weight: 600;
            color: #555;
        }
        .analysis-value {
            flex: 1;
            color: #333;
        }
        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }
        .tag-neutral { background: #f59e0b; color: white; }
        .tag-complaint { background: #ef4444; color: white; }
        .tag-praise { background: #10b981; color: white; }
        .tag-unwarranted { background: #f59e0b; color: white; }
        .tag-no-response { background: #9ca3af; color: white; }
        
        .suggested-reply {
            background: #d4edda;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .suggested-reply h3 {
            color: #155724;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .suggested-reply textarea {
            width: 100%;
            min-height: 80px;
            padding: 10px;
            border: 1px solid #c3e6cb;
            border-radius: 4px;
            font-family: inherit;
            resize: vertical;
        }
        
        .actions {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: #C01818; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-success { background: #10b981; color: white; }
        
        .progress {
            margin-bottom: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
        }
        .progress-bar {
            height: 8px;
            background: #e9ecef;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #C01818;
            transition: width 0.3s;
        }
        .progress-text {
            margin-top: 8px;
            color: #666;
            font-size: 14px;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state h2 {
            margin-bottom: 10px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>McAfee Review Analyzer</h1>
        <p class="subtitle">One review at a time with LLM-powered classification</p>
        
        <div class="progress">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%"></div>
            </div>
            <div class="progress-text">Review <span id="currentReview">0</span> of <span id="totalReviews">0</span></div>
        </div>
        
        <div id="reviewContainer">
            <div class="empty-state">
                <h2>Loading reviews...</h2>
                <p>Please wait while we fetch the review queue.</p>
            </div>
        </div>
    </div>

    <script>
        // Sample reviews for demo
        const reviews = [
            {
                id: "rev_001",
                author: "Sarah M",
                rating: 3,
                content: "I just started using this protection for myself and my daughters. So far it's been okay but I haven't really explored all the features yet.",
                platform: "google_play",
                developer_reply: "We're sorry to hear about your experience. Please contact support."
            },
            {
                id: "rev_002",
                author: "John D",
                rating: 1,
                content: "VPN keeps disconnecting every 5 minutes. Can't work remotely like this. Waste of money.",
                platform: "app_store",
                developer_reply: ""
            },
            {
                id: "rev_003",
                author: "Mike T",
                rating: 5,
                content: "Best antivirus I've ever used! The VPN is fast and reliable. Customer support was super helpful.",
                platform: "google_play",
                developer_reply: "We apologize for any issues you've experienced."
            }
        ];
        
        let currentIndex = 0;
        const results = [];
        
        // LLM Analysis (simulated)
        function analyzeReview(review) {
            const content = review.content.toLowerCase();
            const rating = review.rating;
            
            // Determine intent
            let intent;
            if (rating <= 2) intent = 'COMPLAINT';
            else if (rating === 3) {
                if (content.includes('just started') || content.includes('giving it a try')) intent = 'NEUTRAL_STATEMENT';
                else if (content.includes('problem') || content.includes('issue')) intent = 'COMPLAINT';
                else intent = 'FEEDBACK';
            } else intent = 'PRAISE';
            
            // Determine themes
            const themes = [];
            if (content.includes('vpn')) themes.push('VPN');
            if (content.includes('support') || content.includes('help')) themes.push('Customer Support');
            if (content.includes('slow') || content.includes('battery')) themes.push('Performance');
            
            // Determine quality tag
            let qualityTag;
            const hasReply = review.developer_reply && review.developer_reply.trim();
            if (!hasReply) qualityTag = 'NO RESPONSE';
            else if ((review.developer_reply.toLowerCase().includes('sorry') || 
                      review.developer_reply.toLowerCase().includes('apologize')) && 
                     (intent === 'NEUTRAL_STATEMENT' || intent === 'PRAISE')) {
                qualityTag = 'UNWARRANTED APOLOGY';
            } else {
                qualityTag = 'CORRECT';
            }
            
            // Generate suggested reply
            let suggestedReply;
            if (intent === 'PRAISE') {
                suggestedReply = `Thank you for your positive feedback! We're thrilled you're enjoying McAfee's protection.`;
            } else if (intent === 'NEUTRAL_STATEMENT') {
                suggestedReply = `Thanks for trying McAfee! Have you explored features like our VPN, Dark Web Monitoring, or Identity Theft Protection?`;
            } else if (intent === 'COMPLAINT') {
                if (themes.includes('VPN')) {
                    suggestedReply = `We are truly sorry your experience fell short. For VPN issues, try toggling it off and back on in the McAfee app. Our VPN specialists at 1-866-622-3911 can also diagnose connection drops remotely.`;
                } else {
                    suggestedReply = `We are truly sorry your experience fell short. Please reach out at mcafee.com/support or call 1-866-622-3911 — our specialists will stay with you until it is fully resolved.`;
                }
            } else {
                suggestedReply = `Thank you for sharing your feedback! We'd love to know: what would make your experience a 5-star one?`;
            }
            
            return { intent, themes, qualityTag, suggestedReply };
        }
        
        function getTagClass(intent, qualityTag) {
            if (qualityTag === 'UNWARRANTED APOLOGY') return 'tag-unwarranted';
            if (qualityTag === 'NO RESPONSE') return 'tag-no-response';
            if (intent === 'COMPLAINT') return 'tag-complaint';
            if (intent === 'PRAISE') return 'tag-praise';
            return 'tag-neutral';
        }
        
        function renderReview(index) {
            const review = reviews[index];
            const analysis = analyzeReview(review);
            
            document.getElementById('currentReview').textContent = index + 1;
            document.getElementById('totalReviews').textContent = reviews.length;
            document.getElementById('progressFill').style.width = ((index + 1) / reviews.length * 100) + '%';
            
            const container = document.getElementById('reviewContainer');
            container.innerHTML = `
                <div class="review-card">
                    <div class="review-header">
                        <span class="author">${review.author}</span>
                        <span class="rating">${'⭐'.repeat(review.rating)}</span>
                    </div>
                    <div class="review-content">${review.content}</div>
                    ${review.developer_reply ? `
                        <div class="mcafee-response">
                            <strong>McAfee's Response:</strong><br>
                            ${review.developer_reply}
                        </div>
                    ` : '<div class="mcafee-response"><strong>McAfee's Response:</strong> No response</div>'}
                </div>
                
                <div class="llm-analysis">
                    <h3>💡 LLM Analysis</h3>
                    <div class="analysis-row">
                        <span class="analysis-label">Intent:</span>
                        <span class="analysis-value">
                            <span class="tag ${getTagClass(analysis.intent, analysis.qualityTag)}">${analysis.intent}</span>
                        </span>
                    </div>
                    <div class="analysis-row">
                        <span class="analysis-label">Themes:</span>
                        <span class="analysis-value">${analysis.themes.join(', ') || 'None detected'}</span>
                    </div>
                    <div class="analysis-row">
                        <span class="analysis-label">Quality Tag:</span>
                        <span class="analysis-value">
                            <span class="tag ${getTagClass(analysis.intent, analysis.qualityTag)}">${analysis.qualityTag}</span>
                        </span>
                    </div>
                </div>
                
                <div class="suggested-reply">
                    <h3>💡 Suggested Better Reply</h3>
                    <textarea id="suggestedReply">${analysis.suggestedReply}</textarea>
                </div>
                
                <div class="actions">
                    <button class="btn btn-primary" onclick="saveAndNext()">✓ Save & Next</button>
                    <button class="btn btn-secondary" onclick="skipReview()">Skip</button>
                    <button class="btn btn-success" onclick="resetToSuggested()">Reset to LLM Suggestion</button>
                </div>
            `;
            
            // Store current analysis
            window.currentAnalysis = analysis;
            window.currentReview = review;
        }
        
        function saveAndNext() {
            const editedReply = document.getElementById('suggestedReply').value;
            results.push({
                ...window.currentReview,
                intent: window.currentAnalysis.intent,
                themes: window.currentAnalysis.themes,
                qualityTag: window.currentAnalysis.qualityTag,
                suggestedReply: editedReply,
                llmSuggested: window.currentAnalysis.suggestedReply
            });
            
            currentIndex++;
            if (currentIndex < reviews.length) {
                renderReview(currentIndex);
            } else {
                showComplete();
            }
        }
        
        function skipReview() {
            currentIndex++;
            if (currentIndex < reviews.length) {
                renderReview(currentIndex);
            } else {
                showComplete();
            }
        }
        
        function resetToSuggested() {
            document.getElementById('suggestedReply').value = window.currentAnalysis.suggestedReply;
        }
        
        function showComplete() {
            document.getElementById('reviewContainer').innerHTML = `
                <div class="empty-state">
                    <h2>✓ All Reviews Processed!</h2>
                    <p>You have reviewed ${results.length} reviews.</p>
                    <br>
                    <button class="btn btn-primary" onclick="downloadResults()">Download Results</button>
                </div>
            `;
            document.querySelector('.progress').style.display = 'none';
        }
        
        function downloadResults() {
            const dataStr = JSON.stringify(results, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'review-analysis-results.json';
            a.click();
        }
        
        // Start
        renderReview(0);
    </script>
</body>
</html>
